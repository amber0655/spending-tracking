        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);

        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }

<script>
        const captureBtn = document.getElementById('capture-btn');
        const flashToggle = document.getElementById('flash-toggle');
        const viewfinder = document.getElementById('viewfinder');
        const processingView = document.getElementById('processing-view');

        // Capture Interaction
        captureBtn.addEventListener('click', () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[60] opacity-0 transition-opacity pointer-events-none';
            document.body.appendChild(flash);
            
            setTimeout(() => flash.style.opacity = '1', 10);
            setTimeout(() => {
                flash.style.opacity = '0';
                viewfinder.classList.add('opacity-0', 'scale-105');
                
                setTimeout(() => {
                    viewfinder.classList.add('hidden');
                    processingView.classList.remove('hidden');
                    setTimeout(() => {
                        processingView.classList.remove('opacity-0', 'scale-95');
                        processingView.classList.add('opacity-100', 'scale-100');
                        flash.remove();
                    }, 50);
                }, 400);
            }, 100);
        });

        // Flash Toggle Logic
        let isFlashOn = false;
        flashToggle.addEventListener('click', () => {
            isFlashOn = !isFlashOn;
            const icon = flashToggle.querySelector('span');
            icon.textContent = isFlashOn ? 'flash_on' : 'flash_off';
            flashToggle.classList.toggle('bg-white/30', isFlashOn);
            flashToggle.classList.toggle('text-secondary-fixed', isFlashOn);
        });

        // Reset Camera Logic
        function resetCamera() {
            processingView.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                processingView.classList.add('hidden');
                viewfinder.classList.remove('hidden');
                setTimeout(() => {
                    viewfinder.classList.remove('opacity-0', 'scale-105');
                    viewfinder.classList.add('opacity-100', 'scale-100');
                }, 50);
            }, 400);
        }

        // Add haptic-like feel to buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
