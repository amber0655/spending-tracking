<main class="pt-24 px-container-padding-mobile max-w-2xl mx-auto animate-subtle-slide"><div class="mb-stack-lg"><h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Record Expense</h1><p class="font-body-sm text-body-sm text-on-surface-variant">Stay mindful of your spending habits.</p></div><div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg mb-stack-lg shadow-sm"><label class="font-label-caps text-label-caps text-on-surface-variant mb-2 block">AMOUNT</label><div class="flex items-baseline gap-2"><span class="font-display-lg text-display-lg text-primary-container">$</span><input autofocus="" class="w-full bg-transparent border-none p-0 font-display-lg text-display-lg text-primary focus:ring-0 placeholder:text-outline-variant" id="amount-input" placeholder="0.00" step="0.01" type="number"></div></div><div class="space-y-stack-lg"><section><label class="font-label-caps text-label-caps text-on-surface-variant mb-stack-md block">CATEGORY</label><div class="flex flex-wrap gap-2"><button class="px-4 py-2 rounded-full border border-secondary bg-secondary/5 text-secondary font-label-caps text-label-caps flex items-center gap-2 transition-all hover:bg-secondary/10"><span class="material-symbols-outlined text-[18px]">restaurant</span> Dining</button><button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 hover:border-primary transition-all"><span class="material-symbols-outlined text-[18px]">shopping_bag</span> Shopping</button><button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 hover:border-primary transition-all"><span class="material-symbols-outlined text-[18px]">commute</span> Transport</button><button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 hover:border-primary transition-all"><span class="material-symbols-outlined text-[18px]">home</span> Bills</button><button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 hover:border-primary transition-all"><span class="material-symbols-outlined text-[18px]">more_horiz</span> Other</button></div></section><div class="grid grid-cols-1 md:grid-cols-2 gap-stack-lg"><div class="space-y-2"><label class="font-label-caps text-label-caps text-on-surface-variant block">DATE</label><div class="relative"><input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-lg text-on-surface" type="date" value="2023-10-27"></div></div><div class="space-y-2"><label class="font-label-caps text-label-caps text-on-surface-variant block">NOTES (OPTIONAL)</label><input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-lg text-on-surface" placeholder="Dinner with colleagues" type="text"></div></div><button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-base mt-stack-lg"><span class="material-symbols-outlined">add</span> Add Expense</button></div><div class="mt-12 p-stack-lg bg-secondary-container/20 rounded-2xl border border-secondary/10 flex items-start gap-4"><div class="bg-secondary p-2 rounded-lg text-on-secondary"><span class="material-symbols-outlined">lightbulb</span></div><div><p class="font-body-lg text-on-secondary-container font-semibold">Spending Tip</p><p class="font-body-sm text-on-secondary-container opacity-80">You've stayed within your daily budget for 5 days straight. Keeping this entry under $40 will maintain your streak!</p></div></div></main>

<script>
        // Simple Interaction logic for category pills
        const pills = document.querySelectorAll('button[class*="rounded-full"]');
        pills.forEach(pill => {
            pill.addEventListener('click', function() {
                pills.forEach(p => {
                    p.classList.remove('border-secondary', 'bg-secondary/5', 'text-secondary');
                    p.classList.add('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface-variant');
                });
                this.classList.remove('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface-variant');
                this.classList.add('border-secondary', 'bg-secondary/5', 'text-secondary');
            });
        });

        // Numeric input auto-formatting placeholder (Simulation)
        const amountInput = document.getElementById('amount-input');
        amountInput.addEventListener('input', (e) => {
            if(e.target.value.length > 8) {
                e.target.value = e.target.value.slice(0, 8);
            }
        });
    </script>
