<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Aura Finance | Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">

                        "background": "#f7f9fb",
                        "primary-container": "#131b2e",
                        "on-background": "#191c1e",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-container": "#75859d",
                        "error": "#ba1a1a",
                        "surface-container": "#eceef0",
                        "tertiary-fixed": "#d3e4fe",
                        "outline-variant": "#c6c6cd",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "inverse-surface": "#2d3133",
                        "surface-dim": "#d8dadc",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#000000",
                        "on-surface-variant": "#45464d",
                        "on-secondary-container": "#00714d",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-tint": "#565e74",
                        "secondary-container": "#6cf8bb",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",
                        "secondary": "#006c49",
                        "outline": "#76777d",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary-container": "#7c839b",
                        "primary": "#000000",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "inverse-primary": "#bec6e0",
                        "on-secondary-fixed-variant": "#005236",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed": "#0b1c30",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-sm": "4px",
                        "container-padding-mobile": "16px",
                        "container-padding-desktop": "32px",
                        "base": "8px",
                        "stack-md": "12px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "data-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],

                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                        "data-mono": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .soft-blur-bg {
            background: radial-gradient(circle at 0% 0%, rgba(108, 248, 187, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(190, 198, 224, 0.2) 0%, transparent 50%);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop soft-blur-bg">
<!-- Auth Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo & Branding -->
<header class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary text-on-primary rounded-2xl shadow-xl mb-6">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg tracking-tight mb-2">Aura Finance</h1>
<p class="font-body-lg text-on-surface-variant">Step into financial serenity</p>
</header>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-md p-stack-lg md:p-8">
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group input-focus-ring rounded-lg transition-all">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-sm">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-body-lg focus:outline-none focus:border-primary focus:ring-0 transition-colors placeholder:text-on-surface-variant/40" id="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative group input-focus-ring rounded-lg transition-all">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-sm">lock</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-12 text-body-lg focus:outline-none focus:border-primary focus:ring-0 transition-colors placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant/50 hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-sm" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-2 space-y-4"><div class="space-y-4">
<button class="w-full bg-primary text-on-primary font-title-md py-4 rounded-xl shadow-md hover:translate-y-[-2px] active:scale-[0.98] transition-all duration-200" type="submit">
        Sign in with email
    </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-caps text-label-caps text-on-surface-variant/50 uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest text-on-surface font-title-md py-4 rounded-xl border border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98]" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXFriKNM2c_tFzNchhxd4xEhln9egeJV3WOnPK0BIIRjKrO4mhYQhy0g-ih1K34iEVbrbhpglbAiL1k1zlj27MDl-z5xj3J905VVa7ZffUkKbGw6jv38k8N4tjNpjFiQSN8ZqRvmEl-TLDfEXCtx26ZWx2phQsh-VvShyU6FU9uoLC8E_K5Z6op12Yzo1qfYXJhao9ltLADwJGGFtI1sPQgafKw1iIKDDjIMcbSje38oWuRdBqLX5mTtiICVRJcMP13-mmo9uwbNn-">
        Continue with Google
    </button>
</div></div>
</form>
</div>
<!-- Secondary Footer -->
<footer class="mt-8 text-center"><p class="font-body-sm text-on-surface-variant">
    New to Aura? 
    <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Create Account</a>
</p></footer>
</main>
<!-- Visual Background Element -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<!-- Abstract Glass Orb 1 -->
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/20 blur-[100px] animate-pulse"></div>
<!-- Abstract Glass Orb 2 -->
<div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed/30 blur-[120px]"></div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Lightweight form interaction
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <div class="flex items-center justify-center">
                    <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            `;

            // Mock transition to dashboard
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                // Add success visual feedback
                btn.classList.add('bg-secondary', 'text-on-secondary');
                btn.innerText = 'Authenticated';
            }, 1500);
        });
    </script>
</body></html>
